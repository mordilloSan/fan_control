<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="t d">
<title id="t">System fan</title><desc id="d">Firmware: stopped below 25 °C, 2000 to 83, maximum above. Driver curve: stopped below 25 °C, 1000 to 40, 1600 to 50, then firmware.</desc>
<style>
  .surface { fill: #fcfcfb; }
  .grid { stroke: #e1e0d9; stroke-width: 1; }
  .axis { stroke: #c3c2b7; stroke-width: 1; }
  .ink1 { fill: #0b0b0b; } .ink2 { fill: #52514e; } .muted { fill: #898781; }
  .fw { stroke: #2a78d6; } .ours { stroke: #eb6834; }
  .dot-ours { fill: #eb6834; stroke: #fcfcfb; stroke-width: 2; }
  .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .t { font-size: 16px; font-weight: 600; } .s { font-size: 12px; }
  .tick { font-size: 11px; font-variant-numeric: tabular-nums; }
  .lab { font-size: 11px; font-variant-numeric: tabular-nums; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1a1a19; }
    .grid { stroke: #2c2c2a; } .axis { stroke: #383835; }
    .ink1 { fill: #f0efec; } .ink2 { fill: #c3c2b7; }
    .fw { stroke: #3987e5; } .ours { stroke: #d95926; }
    .dot-ours { fill: #d95926; stroke: #1a1a19; }
  }
</style>
<rect class="surface" x="0" y="0" width="720" height="400" rx="8"/>
<text class="t ink1" x="64" y="28">System fan</text>
<text class="s ink2" x="64" y="47">Target in nominal RPM (code × 100) by EC system temperature</text>
<line class="line fw" x1="64" y1="70" x2="82" y2="70"/>
<text class="s ink2" x="88" y="74">Firmware</text>
<line class="line ours" x1="174" y1="70" x2="192" y2="70"/>
<text class="s ink2" x="198" y="74">Driver curve</text>
<line class="axis" x1="64" y1="348.0" x2="692" y2="348.0"/>
<text class="tick muted" x="56" y="352.0" text-anchor="end">0</text>
<line class="grid" x1="64" y1="301.5" x2="692" y2="301.5"/>
<text class="tick muted" x="56" y="305.5" text-anchor="end">1K</text>
<line class="grid" x1="64" y1="254.9" x2="692" y2="254.9"/>
<text class="tick muted" x="56" y="258.9" text-anchor="end">2K</text>
<line class="grid" x1="64" y1="208.4" x2="692" y2="208.4"/>
<text class="tick muted" x="56" y="212.4" text-anchor="end">3K</text>
<line class="grid" x1="64" y1="161.8" x2="692" y2="161.8"/>
<text class="tick muted" x="56" y="165.8" text-anchor="end">4K</text>
<line class="grid" x1="64" y1="115.3" x2="692" y2="115.3"/>
<text class="tick muted" x="56" y="119.3" text-anchor="end">5K</text>
<text class="tick muted" x="56" y="80" text-anchor="end">RPM</text>
<line class="axis" x1="64.0" y1="348" x2="64.0" y2="352"/>
<text class="tick muted" x="64.0" y="366" text-anchor="middle">0</text>
<line class="axis" x1="126.8" y1="348" x2="126.8" y2="352"/>
<text class="tick muted" x="126.8" y="366" text-anchor="middle">10</text>
<line class="axis" x1="189.6" y1="348" x2="189.6" y2="352"/>
<text class="tick muted" x="189.6" y="366" text-anchor="middle">20</text>
<line class="axis" x1="252.4" y1="348" x2="252.4" y2="352"/>
<text class="tick muted" x="252.4" y="366" text-anchor="middle">30</text>
<line class="axis" x1="315.2" y1="348" x2="315.2" y2="352"/>
<text class="tick muted" x="315.2" y="366" text-anchor="middle">40</text>
<line class="axis" x1="378.0" y1="348" x2="378.0" y2="352"/>
<text class="tick muted" x="378.0" y="366" text-anchor="middle">50</text>
<line class="axis" x1="440.8" y1="348" x2="440.8" y2="352"/>
<text class="tick muted" x="440.8" y="366" text-anchor="middle">60</text>
<line class="axis" x1="503.6" y1="348" x2="503.6" y2="352"/>
<text class="tick muted" x="503.6" y="366" text-anchor="middle">70</text>
<line class="axis" x1="566.4" y1="348" x2="566.4" y2="352"/>
<text class="tick muted" x="566.4" y="366" text-anchor="middle">80</text>
<line class="axis" x1="629.2" y1="348" x2="629.2" y2="352"/>
<text class="tick muted" x="629.2" y="366" text-anchor="middle">90</text>
<line class="axis" x1="692.0" y1="348" x2="692.0" y2="352"/>
<text class="tick muted" x="692.0" y="366" text-anchor="middle">100</text>
<text class="s ink2" x="378.0" y="390" text-anchor="middle">EC system temperature (°C)</text>
<path class="line fw" d="M64.0,348.0 H221.0 V254.9 H585.2 V110.6 H692.0"/>
<path class="line ours" d="M64.0,348.0 H221.0 V301.5 H315.2 V273.5 H378.0"/>
<text class="lab ink2" x="268.1" y="293.5" text-anchor="middle">1000</text>
<text class="lab ink2" x="346.6" y="265.5" text-anchor="middle">1600</text>
<circle class="dot-ours" cx="378.0" cy="273.5" r="4.5"/>
<text class="lab ink2" x="386.0" y="291.5">50 °C: hands over to firmware</text>
</svg>
